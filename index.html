<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangman</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Hang<span>man</span></div>
  <div class="mistake-badge">Mistakes: <span class="count" id="mistake-count">0</span> / 6</div>
</header>

<div class="game-wrap">

  <!-- Left: Gallows -->
  <div class="gallows-panel">
    <div class="category-tag" id="category-tag">Science</div>

    <svg id="hangman-svg" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Gallows structure (always visible) -->
      <line x1="20" y1="210" x2="180" y2="210" stroke="#444" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="210" x2="60" y2="20" stroke="#444" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="20" x2="130" y2="20" stroke="#444" stroke-width="3" stroke-linecap="round"/>
      <line x1="130" y1="20" x2="130" y2="45" stroke="#444" stroke-width="3" stroke-linecap="round"/>
      <!-- Hangman parts (hidden by default) -->
      <circle id="h-head" cx="130" cy="58" r="13" stroke="#e8ff47" stroke-width="2.5" display="none"/>
      <line id="h-body" x1="130" y1="71" x2="130" y2="120" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round" display="none"/>
      <line id="h-arm-l" x1="130" y1="85" x2="110" y2="105" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round" display="none"/>
      <line id="h-arm-r" x1="130" y1="85" x2="150" y2="105" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round" display="none"/>
      <line id="h-leg-l" x1="130" y1="120" x2="110" y2="148" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round" display="none"/>
      <line id="h-leg-r" x1="130" y1="120" x2="150" y2="148" stroke="#e8ff47" stroke-width="2.5" stroke-linecap="round" display="none"/>
    </svg>

    <div class="hint-box">💡 Hint: <span id="hint-text">—</span></div>
  </div>

  <!-- Right panel -->
  <div class="right-panel">
    <div class="word-display" id="word-display"></div>
    <div class="undo-row">
      <button class="btn-undo" id="btn-undo" onclick="undoLastGuess()" disabled>
        ↩ Undo — <span class="undo-letter" id="undo-label">—</span>
      </button>
    </div>
    <div class="keyboard" id="keyboard"></div>
  </div>

</div>

<!-- Win/Lose Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon" id="modal-icon"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-msg" id="modal-msg"></div>
    <div class="modal-word" id="modal-word"></div>
    <button class="btn-next" onclick="nextWord()">Next Word →</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
